<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSV Lab | Official Website</title>
  <meta name="description" content="RSV Lab advances antimicrobial susceptibility testing (AST), AMR surveillance, and bioinformatics research. Founded by Kamol Das, Department of Microbiology, University of Chittagong.">
  <link rel="canonical" href="https://rsv8lab.github.io/">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#06283d">

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="RSV Lab | Official Website">
  <meta property="og:description" content="Advancing AST, AMR surveillance, and computational microbiology. Founded by Kamol Das.">
  <meta property="og:url" content="https://rsv8lab.github.io/">
  <meta property="og:image" content="https://rsv8lab.github.io/assets/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="assets/images/rsvlab-logo.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="styles.css">

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ResearchOrganization",
    "name": "RSV Lab",
    "url": "https://rsv8lab.github.io/",
    "logo": "https://rsv8lab.github.io/assets/images/rsvlab-logo.png",
    "description": "An integrated computational framework for microbiology, AST, and bioinformatics research.",
    "founder": {
      "@type": "Person",
      "name": "Kamol Das",
      "affiliation": "University of Chittagong",
      "sameAs": "https://github.com/KamolDas"
    }
  }
  </script>
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="header">
    <div class="container navbar">
      <a href="#top" class="nav-logo" id="nav-logo"></a>
      <nav class="nav-links" id="nav-links" aria-label="Main navigation"></nav>
      <div class="nav-icons" id="nav-icons"></div>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <i class="fas fa-bars"></i>
      </button>
    </div>
  </header>

  <!-- ============ HERO ============ -->
  <section class="hero" id="top">
    <div class="container">
      <div class="top-notices" id="top-notices"></div>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-subtitle" id="hero-subtitle"></p>
      <div class="founder-badge" id="hero-badge"></div>
      <div class="hero-ctas" id="hero-ctas"></div>
      <div class="hero-highlights" id="hero-highlights"></div>
      <div class="hero-banner" id="hero-banner"></div>
    </div>
  </section>

  <!-- ============ ABOUT ============ -->
  <section class="section" id="about">
    <div class="container">
      <h2 class="section-title" id="about-title"></h2>
      <p class="section-subtitle" id="about-subtitle"></p>
      <div class="card-grid" id="about-cards"></div>
    </div>
  </section>

  <!-- ============ RESEARCH ============ -->
  <section class="section section-alt" id="research">
    <div class="container">
      <h2 class="section-title" id="research-title"></h2>
      <p class="section-subtitle" id="research-subtitle"></p>
      <div class="card-grid" id="research-cards"></div>
    </div>
  </section>

  <!-- ============ TOOLS ============ -->
  <section class="section" id="tools">
    <div class="container">
      <h2 class="section-title" id="tools-title"></h2>
      <p class="section-subtitle" id="tools-subtitle"></p>
      <div class="card-grid" id="tools-cards"></div>
    </div>
  </section>

  <!-- ============ PUBLICATIONS ============ -->
  <section class="section section-alt" id="publications">
    <div class="container">
      <h2 class="section-title" id="publications-title"></h2>
      <p class="section-subtitle" id="publications-subtitle"></p>
      <div class="publication-list" id="publications-list"></div>
    </div>
  </section>

  <!-- ============ PROJECTS ============ -->
  <section class="section" id="projects">
    <div class="container">
      <h2 class="section-title" id="projects-title"></h2>
      <p class="section-subtitle" id="projects-subtitle"></p>
      <div class="project-tabs" id="projects-tabs"></div>
      <div class="card-grid" id="projects-cards"></div>
    </div>
  </section>

  <!-- ============ TEAM ============ -->
  <section class="section section-alt" id="team">
    <div class="container">
      <h2 class="section-title" id="team-title"></h2>
      <div class="founder-container" id="team-founder"></div>
      <div class="member-grid" id="team-members"></div>
    </div>
  </section>

  <!-- ============ CONTACT ============ -->
  <section class="section contact-section" id="contact">
    <div class="container">
      <h2 class="section-title" id="contact-title"></h2>
      <p class="section-subtitle" id="contact-subtitle"></p>
      <div class="contact-grid" id="contact-grid"></div>
    </div>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <div class="container">
      <p class="footer-tagline" id="footer-tagline"></p>
      <p class="footer-copy" id="footer-copy"></p>
      <div class="footer-links" id="footer-links"></div>
    </div>
  </footer>

  <button class="back-to-top" id="back-to-top" aria-label="Back to top">
    <i class="fas fa-arrow-up"></i>
  </button>

  <!-- ============ PDF MODAL ============ -->
  <div class="pdf-modal" id="pdf-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="pdf-modal-title">
    <div class="pdf-modal-backdrop" data-close-modal></div>
    <div class="pdf-modal-panel">
      <header class="pdf-modal-header">
        <h3 id="pdf-modal-title">Document</h3>
        <div class="pdf-modal-actions">
          <a id="pdf-modal-download" href="#" download class="pdf-btn pdf-btn-primary">
            <i class="fas fa-download"></i> Download
          </a>
          <button class="pdf-btn pdf-btn-ghost" data-close-modal aria-label="Close">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </header>
      <div class="pdf-modal-body">
        <iframe id="pdf-modal-frame" title="PDF viewer" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <script src="content.js"></script>
  <script src="render.js"></script>
</body>
</html>
