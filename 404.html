<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | RSV Lab</title>
  <meta name="robots" content="noindex, follow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    .notfound {
      min-height: 80vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 40px 20px;
    }
    .notfound i { font-size: 4rem; color: var(--primary-orange); margin-bottom: 24px; }
    .notfound h1 { font-family: var(--font-serif); font-size: 2.5rem; color: var(--dark-navy); margin-bottom: 12px; }
    .notfound p { color: var(--text-muted); margin-bottom: 28px; max-width: 480px; }
  </style>
</head>
<body>
  <div class="notfound">
    <i class="fas fa-dna"></i>
    <h1>404 — Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has moved. Head back to the RSV Lab homepage.</p>
    <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Back to Home</a>
  </div>
</body>
</html>
